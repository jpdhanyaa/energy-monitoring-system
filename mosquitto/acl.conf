# ==============================================================================
# Mosquitto Access Control List (ACL)
# Restricts topic permissions by client role
# ==============================================================================

# 1. ESP32 Microcontroller Node
user energy_client
topic write energy/esp32-energy-devkit-01/telemetry
topic write energy/esp32-energy-devkit-01/state
topic write energy/esp32-energy-devkit-01/ack
topic write energy/esp32-energy-devkit-01/status
topic read  energy/esp32-energy-devkit-01/commands

# 2. Node.js Express Backend Service
user backend_service
topic read  energy/+/telemetry
topic read  energy/+/state
topic read  energy/+/ack
topic read  energy/+/status
topic write energy/+/commands

# 3. Super Admin / Maintenance
user admin
topic readwrite #
